plugins { id 'com.android.application' }

android {
    namespace 'dev.imbloxi.nodelink'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'dev.imbloxi.nodelink'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
}

tasks.register('checkWebAssets') {
    doLast {
        if (!file('src/main/assets/public/index.html').isFile()) {
            throw new GradleException('Missing mobile assets. Run npm ci and npm run mobile:build from desktop/ first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkWebAssets' }
