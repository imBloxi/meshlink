name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app (tests, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

  python:
    name: Python app (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest

  firmware:
    name: Firmware (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Versions match
        run: |
          app=$(node -p "require('./desktop/package.json').version")
          fw=$(sed -n 's/#define ML_FW_VERSION "\(.*\)"/\1/p' firmware/src/protocol.h)
          echo "app $app, firmware $fw"
          test "$app" = "$fw"
      - run: pio run -e d1_mini -e nodemcuv2
        working-directory: firmware
