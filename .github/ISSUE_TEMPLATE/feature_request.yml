name: Feature request
description: Suggest an idea.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: protocol
    attributes:
      label: Scope
      options:
        - label: This needs a protocol change (nodes and apps must update together)
