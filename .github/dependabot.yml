version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directory: /app
    schedule: { interval: monthly }
