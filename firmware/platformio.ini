; Build dirs live outside the (OneDrive-synced) project: set
; PLATFORMIO_WORKSPACE_DIR, as desktop/scripts/bundle-firmware.mjs does.
;
; One firmware source, many chips. All of them speak the same ESP-NOW frames,
; so an ESP8266 and an ESP32 on the same channel form one mesh.
;
; OLED status screen (optional, SSD1306/SH1106 over I2C): the firmware scans
; the usual SDA/SCL pins for 0x3C/0x3D, so most boards need no flags. Force a
; wiring with: -DML_OLED_SDA=4 -DML_OLED_SCL=5 -DML_OLED_ADDR=0x3C
; Other switches: -DML_OLED_H=32 (128x32 panel), -DML_OLED_SH1106=1,
; -DML_OLED_ROTATE=1, -DML_BTN_PIN=<gpio> (page button, hold 1.5 s to swap
; the SSD1306/SH1106 driver), -DML_OLED=0 (no display code).

[common]
platform = espressif8266
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 4 MB flash: 2 MB app, 2 MB LittleFS (config + phone web app).
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
lib_deps =
  links2004/WebSockets@^2.6.1

; ---- ESP8266 -------------------------------------------------------------------

[env:d1_mini]
extends = common
board = d1_mini

; NodeMCU boards: pio run -e nodemcuv2 -t upload
[env:nodemcuv2]
extends = common
board = nodemcuv2
; The FLASH button on GPIO0 pages through the screens.
build_flags = -DML_BTN_PIN=0

; 1.3" OLEDs usually carry an SH1106, not an SSD1306. Shifted or snowy picture
; on the normal image? Flash this one.
[env:d1_mini_sh1106]
extends = env:d1_mini
build_flags = -DML_OLED_SH1106=1

[env:nodemcuv2_sh1106]
extends = env:nodemcuv2
build_flags = -DML_BTN_PIN=0 -DML_OLED_SH1106=1

; ---- ESP32 family ----------------------------------------------------------------

[esp32_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  links2004/WebSockets@^2.6.1

; Classic ESP32 dev boards (WROOM/WROVER). OLED on GPIO21/22 is found by the scan.
[env:esp32dev]
extends = esp32_common
board = esp32dev
build_flags = -DML_BTN_PIN=0

; ESP32-S3 dev kit, USB-UART port (the one with the bridge chip).
[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = -DML_BTN_PIN=0

; ESP32-S3 on its native USB port.
[env:esp32s3_usb]
extends = env:esp32s3
build_flags = -DML_BTN_PIN=0 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 boards with the built-in USB serial (most dev kits and SuperMinis).
[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags = -DML_BTN_PIN=9 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Heltec WiFi Kit 32 (V1/V2): OLED is built in (SDA 4, SCL 15, reset 16).
[env:heltec_wifi_kit_32]
extends = esp32_common
board = heltec_wifi_kit_32
build_flags = -DML_BTN_PIN=0 -DML_OLED_SDA=4 -DML_OLED_SCL=15 -DML_OLED_RST=16

; Heltec WiFi Kit 32 V3 (ESP32-S3): OLED needs Vext (GPIO36, active low) and reset 21.
[env:heltec_wifi_kit_32_v3]
extends = esp32_common
board = heltec_wifi_kit_32_V3
build_flags = -DML_BTN_PIN=0 -DML_OLED_SDA=17 -DML_OLED_SCL=18 -DML_OLED_RST=21 -DML_OLED_PWR=36

; ESP32-C6 needs Arduino core 3.x, which only the pioarduino platform ships.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  links2004/WebSockets@^2.6.1
build_flags = -DML_BTN_PIN=9 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
